[tool.black]
line-length = 150
target-version = ['py311']

# Конфигурация для Flake8
[tool.flake8]
max-line-length = 150
extend-ignore = "E203, W503"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "alembic/versions/",
    "build",
    "dist",
]
[tool.pylint.messages_control]
disable = "E501" 