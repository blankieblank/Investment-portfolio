services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: portfolio_zookeeper
    ports: [ "2181:2181" ]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: portfolio_kafka
    ports: [ "9092:9092" ]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    healthcheck:
      test: [ "CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:29092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: portfolio_db
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=portfolio_db
    ports: [ "5432:5432" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d portfolio_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    ports: [ "6379:6379" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: portfolio_api
    build:
      context: ./microservices/api_gateway
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports: [ "8000:8000" ]
    volumes:
      - ./microservices/api_gateway:/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  data_fetcher:
    container_name: portfolio_data_fetcher
    build:
      context: ./microservices/data_fetcher
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    volumes:
      - ./microservices/data_fetcher:/app
    depends_on:
      kafka:
        condition: service_healthy

  portfolio_worker:
    container_name: portfolio_worker
    build:
      context: ./microservices/portfolio_worker
    volumes:
      - ./microservices/portfolio_worker:/app
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=portfolio_db
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      db: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
